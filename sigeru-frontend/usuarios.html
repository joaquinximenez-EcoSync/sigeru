<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios | SiGeRU</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="panel">
    <aside class="sidebar">
        <div class="logo-fila">
            <div class="logo">SiGeRU</div>
            <button class="campana" onclick="abrirNotificaciones()" title="Notificaciones">🔔<span id="contadorMensajes" class="contador"></span></button>
        </div>
        <!-- Lista de notificaciones (se abre al tocar la campana) -->
        <div id="panelNotificaciones" class="panel-notificaciones">
            <div class="panel-notificaciones-titulo">
                <strong>Notificaciones</strong>
                <button class="btn btn-secondary btn-sm" onclick="leerTodos()">Marcar todas como leídas</button>
            </div>
            <div id="listaMensajes"></div>
        </div>
        <div id="avisoEmergente" class="aviso-emergente"></div>
        <a href="panel.html">🏠 Inicio <span id="contadorAlertas" class="contador" title="Alertas"></span></a>
        <a href="mapa.html">🗺️ Mapa</a>
        <a href="incidencias.html" class="no-vecino">⚠️ Incidencias</a>
        <a href="contenedores.html">🗑️ Contenedores</a>
        <a href="camiones.html" class="no-vecino">🚛 Camiones</a>
        <a href="recorridos.html" class="no-vecino">🛣️ Recorridos</a>
        <a href="centros.html" class="no-vecino">🏭 Centros de acopio</a>
        <a href="maquinaria.html" class="no-vecino">⚙️ Maquinaria</a>
        <a href="repuestos.html" class="no-vecino">📦 Repuestos</a>
        <a href="informes.html" class="no-vecino">📄 Informes</a>
        <a href="usuarios.html" class="activo solo-admin">👥 Usuarios</a>
        <a href="parametros.html" class="solo-admin">🛠️ Parámetros</a>
        <div class="usuario">
            <div>
                <strong id="nombreUsuario"></strong>
                <span id="rolUsuario"></span>
            </div>
            <button class="btn btn-secondary btn-sm" onclick="salir()">Cerrar sesión</button>
        </div>
    </aside>

    <main class="contenido">
        <div class="encabezado">
            <h1>Usuarios</h1>
            <button class="btn btn-primary" onclick="nuevoUsuario()">+ Nuevo usuario</button>
        </div>

        <div id="mensaje" class="mensaje"></div>
        <div id="avisoSolicitudes" class="aviso-solicitudes"></div>

        <!-- Ventana emergente (modal) con el formulario para agregar o modificar. Empieza oculta -->
        <dialog id="formModal">
            <h3 id="tituloModal"></h3>
            <form id="formUsuario">
                <div class="form-row">
                    <div class="form-group">
                        <label for="primer_nombre">Nombre *</label>
                        <input id="primer_nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="primer_apellido">Apellido *</label>
                        <input id="primer_apellido" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Correo electrónico *</label>
                        <input id="email" type="email" required>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input id="telefono" type="tel">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="rol">Rol *</label>
                        <select id="rol">
                            <option>Vecino</option>
                            <option>Recolector</option>
                            <option>Operario</option>
                            <option>Administrador</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="contrasena">Contraseña</label>
                        <input id="contrasena" type="password" minlength="6">
                        <small id="ayudaContrasena">Mínimo 6 caracteres.</small>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="calle">Calle <small>(vecinos)</small></label>
                        <input id="calle">
                    </div>
                    <div class="form-group">
                        <label for="zona">Zona <small>(vecinos)</small></label>
                        <input id="zona">
                    </div>
                </div>
                <div class="form-group">
                    <label for="especialidad">Especialidad <small>(operarios)</small></label>
                    <input id="especialidad">
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <button type="button" class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
            </form>
        </dialog>

        <input id="buscador" class="buscador" placeholder="Buscar por nombre, correo, rol o estado..." oninput="buscar()">

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Zona</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaUsuarios"></tbody>
            </table>
        </div>
    </main>
</div>

<script src="js/config.js"></script>
<script src="js/idioma.js"></script>
<script src="js/modelos/servidor.js"></script>
<script src="js/modelos/usuarios.js"></script>
<script src="js/modelos/gestion.js"></script>
<script src="js/modelos/recoleccion.js"></script>
<script src="js/vistas/comun.js"></script>
<script src="js/vistas/tablas.js"></script>
<script src="js/vistas/notificaciones.js"></script>
<script src="js/controladores/sesion.js"></script>
<script src="js/controladores/usuarios.js"></script>
</body>
</html>
