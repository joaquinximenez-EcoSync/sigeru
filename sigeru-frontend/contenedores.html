<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contenedores | SiGeRU</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="panel">
    <aside class="sidebar">
        <div class="logo">SiGeRU</div>
        <a href="panel.html">🏠 Inicio</a>
        <a href="mapa.html">🗺️ Mapa</a>
        <a href="contenedores.html" class="activo">🗑️ Contenedores</a>
        <a href="camiones.html" class="no-vecino">🚛 Camiones</a>
        <a href="centros.html" class="no-vecino">🏭 Centros de acopio</a>
        <a href="maquinaria.html" class="no-vecino">⚙️ Maquinaria</a>
        <a href="usuarios.html" class="solo-admin">👥 Usuarios</a>
        <div class="usuario">
            <div>
                <strong id="nombreUsuario"></strong>
                <span id="rolUsuario"></span>
            </div>
            <button class="btn btn-secondary btn-sm" onclick="salir()">Cerrar sesión</button>
        </div>
    </aside>

    <main class="contenido">
        <div class="encabezado">
            <h1>Contenedores</h1>
            <button class="btn btn-primary solo-gestion" onclick="nuevoContenedor()">+ Nuevo contenedor</button>
        </div>

        <div id="mensaje" class="mensaje"></div>

        <!-- Ventana emergente (modal) con el formulario para agregar o modificar. Empieza oculta -->
        <dialog id="formModal">
            <h3 id="tituloModal"></h3>
            <form id="formContenedor">
                <div class="form-row">
                    <div class="form-group">
                        <label for="calle">Calle *</label>
                        <input id="calle" required>
                    </div>
                    <div class="form-group">
                        <label for="zona">Zona *</label>
                        <input id="zona" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="id_residuo">Tipo de residuo *</label>
                        <select id="id_residuo" required>
                            <option value="">Elegir...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="capacidad">Capacidad (litros)</label>
                        <input id="capacidad" type="number" min="0">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="estado">Estado</label>
                        <select id="estado">
                            <option>Funcional</option>
                            <option>Roto</option>
                            <option>Desbordado</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="municipio">Municipio</label>
                        <select id="municipio">
                            <option value="">Sin indicar</option>
                            <option>A</option>
                            <option>B</option>
                            <option>C</option>
                            <option>CH</option>
                            <option>D</option>
                            <option>E</option>
                            <option>F</option>
                            <option>G</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="latitud">Latitud</label>
                        <input id="latitud" type="number" step="0.000001" placeholder="-34.9055">
                    </div>
                    <div class="form-group">
                        <label for="longitud">Longitud</label>
                        <input id="longitud" type="number" step="0.000001" placeholder="-56.1889">
                    </div>
                </div>
                <small>La ubicación es opcional. También se puede agregar el contenedor tocando el mapa.</small>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <button type="button" class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
            </form>
        </dialog>

        <input id="buscador" class="buscador" placeholder="Buscar por calle, zona, municipio, estado o residuo..." oninput="buscar()">

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Calle</th>
                        <th>Zona</th>
                        <th>Municipio</th>
                        <th>Tipo de residuo</th>
                        <th>Capacidad</th>
                        <th>Estado</th>
                        <th class="solo-gestion">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaContenedores"></tbody>
            </table>
        </div>
    </main>
</div>

<script src="js/config.js"></script>
<script src="js/modelos/servidor.js"></script>
<script src="js/modelos/usuarios.js"></script>
<script src="js/modelos/gestion.js"></script>
<script src="js/vistas/comun.js"></script>
<script src="js/vistas/tablas.js"></script>
<script src="js/controladores/sesion.js"></script>
<script src="js/controladores/contenedores.js"></script>
</body>
</html>
