<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | SiGeRU</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
<div class="form-container">
    <div class="logo">SiGeRU</div>
    <h1>Iniciar sesión</h1>
    <form id="formLogin">
        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input id="email" type="email" required autocomplete="email">
        </div>
        <div class="form-group">
            <label for="contrasena">Contraseña</label>
            <input id="contrasena" type="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
    </form>
    <div id="mensaje" class="mensaje"></div>
    <p>¿No tienes cuenta? <a id="linkRegistro" href="#">Regístrate</a></p>
    <p><a id="linkLanding" href="#">Volver al inicio</a></p>
</div>

<script src="js/config.js"></script>
<script src="js/modelos/servidor.js"></script>
<script src="js/modelos/usuarios.js"></script>
<script src="js/vistas/comun.js"></script>
<script src="js/controladores/login.js"></script>
</body>
</html>
